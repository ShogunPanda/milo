[package]
  name    = "milo-fuzz"
  version = "0.0.0"
  edition = "2024"
  publish = false

[package.metadata]
  cargo-fuzz = true

[dependencies]
  arbitrary     = { version = "1", features = ["derive"] }
  libfuzzer-sys = "0.4"
  milo-parser   = { path = ".." }

# The differential oracle against a reference HTTP parser is gated behind this
# feature so the default build stays dependency-free. Enable with:
#   cargo fuzz run smuggling --features oracle
#
# To wire an actual reference parser (e.g. llhttp bindings), add the crate here
# and implement `oracle::compare` in `fuzz_targets/smuggling.rs`. See PLAN.md §4.5.
[features]
  oracle = []

[lib]
  name = "milo_fuzz"
  path = "src/lib.rs"

[[bin]]
  name = "bytes"
  path = "fuzz_targets/bytes.rs"
  test = false
  doc = false
  bench = false

[[bin]]
  name = "http"
  path = "fuzz_targets/http.rs"
  test = false
  doc = false
  bench = false

[[bin]]
  name = "smuggling"
  path = "fuzz_targets/smuggling.rs"
  test = false
  doc = false
  bench = false
